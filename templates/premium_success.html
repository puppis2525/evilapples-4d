<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evil Apples 4D Pro — Activated!</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        evil: {
                            300: '#b08dff', 400: '#9055ff', 500: '#7c3aed',
                            800: '#4c1d95', bg: '#0d0520', surface: '#170e30', card: '#1e1245',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-brand { font-family: 'Fredoka One', cursive; }
        .bg-grid {
            background-image: radial-gradient(circle at 1px 1px, rgba(124, 58, 237, 0.08) 1px, transparent 0);
            background-size: 40px 40px;
        }
        @keyframes goldGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(234, 179, 8, 0.3); }
            50% { box-shadow: 0 0 60px rgba(234, 179, 8, 0.5); }
        }
        .gold-glow { animation: goldGlow 2s ease-in-out infinite; }
        .logo-float { animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="bg-evil-bg text-white min-h-screen bg-grid flex items-center justify-center">
    <div class="text-center px-6 max-w-lg">
        <img src="/static/logo.png" alt="Evil Apples 4D" class="w-24 h-24 mx-auto mb-6 logo-float drop-shadow-2xl">
        <div class="bg-evil-surface border-2 border-yellow-500/30 rounded-2xl p-10 gold-glow">
            <div class="text-5xl mb-4">&#127881;</div>
            <h1 class="font-brand text-3xl text-yellow-400 mb-4">Pro Activated!</h1>
            <p class="text-evil-300 text-lg mb-6">
                Your server now has Evil Apples 4D Pro. All premium features are active immediately.
            </p>
            <div class="bg-evil-card rounded-xl p-4 mb-6 text-left space-y-2">
                <p class="text-evil-300 text-sm"><span class="text-yellow-400">&#9733;</span> Unlimited games per day</p>
                <p class="text-evil-300 text-sm"><span class="text-yellow-400">&#9733;</span> Unlimited tournaments</p>
                <p class="text-evil-300 text-sm"><span class="text-yellow-400">&#9733;</span> Priority AI card generation</p>
                <p class="text-evil-300 text-sm"><span class="text-yellow-400">&#9733;</span> Premium card packs (coming soon)</p>
            </div>
            <p class="text-evil-400 text-sm mb-6">
                Type <code class="bg-evil-card px-2 py-1 rounded text-yellow-400 font-mono">!premium</code> in your Discord server to verify.
            </p>
            <a href="/"
                class="inline-block px-8 py-3 rounded-xl bg-gradient-to-r from-evil-500 to-evil-600 text-white font-bold hover:from-evil-400 hover:to-evil-500 transition-all">
                Back to Leaderboard
            </a>
        </div>
    </div>
</body>
</html>
